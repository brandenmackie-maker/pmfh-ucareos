<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#041028"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="uCare"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" type="image/svg+xml" id="dynamic-favicon" href="./icon-ucare.svg"/>
  <link rel="apple-touch-icon" href="./icon-ucare.svg"/>
  <title>uCareOS — PMFH Level 4F</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #041028; color: #f8fafc; }
    #ucare-splash {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 35%, #0a2a66 0%, #041028 72%);
      transition: opacity 0.35s ease;
    }
    #ucare-splash.is-ready { opacity: 0; pointer-events: none; }
    #ucare-stage-frame { width: 100vw; height: 100dvh; border: none; display: block; background: #070d19; }
  </style>
</head>
<body>
  <!-- Clean 1-Second Launch Splash (Blue uCare Outside -> Full Uncluttered PMFH Cockpit Inside) -->
  <div id="ucare-splash">
    <img src="./icon-ucare.svg" alt="uCareOS" style="width:96px;height:96px;border-radius:22px;box-shadow:0 12px 34px rgba(56,189,248,0.35);"/>
    <div style="font-size:22px;font-weight:900;letter-spacing:-0.4px;">uCare<span style="color:#38bdf8;">OS</span></div>
    <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:rgba(15,23,42,0.85);border:1px solid rgba(251,191,36,0.35);font-size:11.5px;font-weight:700;color:#fde68a;">
      <img src="./icon-pmfh-shield.svg" alt="PMFH" style="width:18px;height:18px;border-radius:4px;"/>
      <span>Paulette &amp; Mattie's Family Home • Level 4F</span>
    </div>
  </div>

  <iframe id="ucare-stage-frame"
    src="https://script.google.com/macros/s/AKfycbxV_Zf7_r9-FtYAYyUZw6tq9gpT7uv7BS-ORfW8Px44F6crd_kudW2IL6d94qVN9K1p5Q/exec"
    allow="microphone *; camera *; geolocation *; clipboard-write *; fullscreen *">
  </iframe>

<script>
(function() {
  const splash = document.getElementById('ucare-splash');
  const frame  = document.getElementById('ucare-stage-frame');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  frame.addEventListener('load', () => setTimeout(() => splash.classList.add('is-ready'), 250));
  setTimeout(() => splash.classList.add('is-ready'), 2600);

  // Silent Top-Level Hardware Microphone Relay -> Controlled 100% by Inner Jarvis UI!
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micMode = 'OFF'; // 'OFF' | 'SINGLE' | 'AMBIENT'
  let rec = null;
  let mutedWhileSpeaking = false;

  function sendToCockpit(payload) {
    try {
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage(Object.assign({ source: 'UCARE_TOP_SHELL' }, payload), '*');
      }
    } catch (e) {}
  }

  function stopHardwareMic() {
    micMode = 'OFF';
    try { if (rec) { rec.onend = null; rec.stop(); } } catch (e) {}
    rec = null;
    sendToCockpit({ type: 'MIC_STATE', active: false, mode: 'OFF' });
  }

  function startHardwareMic(mode) {
    if (!SR) {
      sendToCockpit({ type: 'MIC_ERROR', error: 'speech-unsupported' });
      return;
    }
    micMode = mode || 'AMBIENT';
    try { if (rec) { rec.onend = null; rec.stop(); } } catch (e) {}

    rec = new SR();
    rec.continuous = (micMode === 'AMBIENT');
    rec.interimResults = true;
    rec.lang = 'en-US';

    rec.onstart = () => {
      sendToCockpit({ type: 'MIC_STATE', active: true, mode: micMode });
    };

    rec.onresult = (ev) => {
      if (mutedWhileSpeaking) return;
      let finalTxt = '', interimTxt = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript + ' ';
        else interimTxt += ev.results[i][0].transcript;
      }
      if (interimTxt.trim()) {
        sendToCockpit({ type: 'MIC_INTERIM', transcript: interimTxt.trim(), mode: micMode });
      }
      if (finalTxt.trim()) {
        sendToCockpit({ type: 'MIC_FINAL', transcript: finalTxt.trim(), mode: micMode });
        if (micMode === 'SINGLE') stopHardwareMic();
      }
    };

    rec.onerror = (ev) => {
      const code = String((ev && ev.error) || '');
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        micMode = 'OFF';
        sendToCockpit({ type: 'MIC_ERROR', error: code });
        return;
      }
    };

    rec.onend = () => {
      if (micMode === 'AMBIENT') {
        setTimeout(() => { if (micMode === 'AMBIENT') startHardwareMic('AMBIENT'); }, 280);
      } else {
        sendToCockpit({ type: 'MIC_STATE', active: false, mode: 'OFF' });
      }
    };

    try { rec.start(); } catch (e) {}
  }

  // Listen for commands coming from your existing Jarvis buttons inside Apps Script!
  window.addEventListener('message', (ev) => {
    const d = ev && ev.data;
    if (!d || d.target !== 'UCARE_TOP_SHELL') return;
    if (d.cmd === 'PING_SHELL') {
      sendToCockpit({ type: 'SHELL_READY', hasHardwareMic: !!SR, active: micMode !== 'OFF', mode: micMode });
    } else if (d.cmd === 'START_AMBIENT') {
      mutedWhileSpeaking = false;
      startHardwareMic('AMBIENT');
    } else if (d.cmd === 'START_SINGLE') {
      mutedWhileSpeaking = false;
      startHardwareMic('SINGLE');
    } else if (d.cmd === 'STOP_MIC') {
      stopHardwareMic();
    } else if (d.cmd === 'JARVIS_SPEAKING') {
      mutedWhileSpeaking = !!d.speaking; // Prevents Jarvis from hearing her own voice!
    } else if (d.cmd === 'SET_FAVICON') {
      const fav = document.getElementById('dynamic-favicon');
      if (fav) fav.href = d.icon === 'shield' ? './icon-pmfh-shield.svg' : './icon-ucare.svg';
    }
  });
})();
</script>
</body>
</html>
